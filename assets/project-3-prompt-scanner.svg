<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg-p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e061c"/>
      <stop offset="60%" stop-color="#140a28"/>
      <stop offset="100%" stop-color="#07081a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="grad-p3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-p3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ec4899" stroke-width="0.7" stroke-opacity="0.03"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-p3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="1000" height="230" rx="12" fill="url(#card-bg-p3)"/>
  <rect width="1000" height="230" rx="12" fill="url(#grid-p3)"/>
  <rect x="1" y="1" width="998" height="228" rx="11" fill="none" stroke="#d946ef" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Left Accent Vertical Glow Bar -->
  <rect x="1" y="24" width="4" height="182" rx="2" fill="url(#grad-p3)"/>

  <!-- Corner Tech Brackets -->
  <path d="M 12 28 L 12 14 L 28 14" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 988 28 L 988 14 L 972 14" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 12 202 L 12 216 L 28 216" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 988 202 L 988 216 L 972 216" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Content Container -->
  <g transform="translate(36, 26)">
    <!-- Header Row: Project Index + View Repo Badge -->
    <g>
      <!-- Index Pill -->
      <rect x="0" y="0" width="112" height="22" rx="6" fill="#240c2e" stroke="#db2777" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="10" cy="11" r="3" fill="#f472b6">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="15" class="font-mono" font-size="10.5" font-weight="700" fill="#fce7f3" letter-spacing="1.2">PROJECT 03</text>

      <!-- View Repository CTA Link Tag -->
      <g transform="translate(790, 0)">
        <rect x="0" y="0" width="138" height="22" rx="6" fill="#08182b" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5"/>
        <text x="12" y="15" class="font-mono" font-size="10" font-weight="600" fill="#38bdf8" letter-spacing="0.8">VIEW REPOSITORY</text>
        <text x="122" y="15" class="font-mono" font-size="11" fill="#38bdf8">↗</text>
      </g>
    </g>

    <!-- Project Title -->
    <text x="0" y="58" class="font-sans" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      LLM Prompt Injection Scanner
    </text>

    <!-- Project Description (2 clean lines) -->
    <text x="0" y="90" class="font-sans" font-size="13.5" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      CLI tool for probing LLM API endpoints — YAML payload library, automated runner, and a three-layer
    </text>
    <text x="0" y="112" class="font-sans" font-size="13.5" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      detection stack (heuristic, embedding-based, LLM-judge) for catching prompt injection successes.
    </text>

    <!-- Bottom Row: Tech Stack Chips -->
    <g transform="translate(0, 142)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect width="78" height="26" rx="6" fill="#150e2e" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
        <text x="39" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e9d5ff" text-anchor="middle">Python</text>
      </g>

      <!-- Ollama -->
      <g transform="translate(86, 0)">
        <rect width="80" height="26" rx="6" fill="#1e1035" stroke="#f472b6" stroke-width="1" stroke-opacity="0.4"/>
        <text x="40" y="17" class="font-mono" font-size="11" font-weight="600" fill="#fce7f3" text-anchor="middle">Ollama</text>
      </g>

      <!-- Sentence-Transformers -->
      <g transform="translate(174, 0)">
        <rect width="180" height="26" rx="6" fill="#0b1b2e" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
        <text x="90" y="17" class="font-mono" font-size="11" font-weight="600" fill="#a5f3fc" text-anchor="middle">Sentence-Transformers</text>
      </g>
    </g>
  </g>
</svg>
