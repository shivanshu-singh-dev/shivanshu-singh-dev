<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg-p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1c"/>
      <stop offset="60%" stop-color="#09102b"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="grad-p2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-p2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Frame Background (Static) -->
  <rect width="1000" height="230" rx="12" fill="url(#card-bg-p2)"/>
  <rect width="1000" height="230" rx="12" fill="url(#grid-p2)"/>
  <rect x="1" y="1" width="998" height="228" rx="11" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Left Accent Vertical Bar -->
  <rect x="1" y="24" width="4" height="182" rx="2" fill="url(#grad-p2)"/>

  <!-- Corner Tech Brackets -->
  <path d="M 12 28 L 12 14 L 28 14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 988 28 L 988 14 L 972 14" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 12 202 L 12 216 L 28 216" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 988 202 L 988 216 L 972 216" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Content Container -->
  <g transform="translate(36, 26)">
    <!-- Header Row: Project Index + View Repo Badge -->
    <g>
      <!-- Index Pill -->
      <rect x="0" y="0" width="112" height="22" rx="6" fill="#081e36" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="10" cy="11" r="3" fill="#38bdf8" opacity="0.9"/>
      <text x="22" y="15" class="font-mono" font-size="10.5" font-weight="700" fill="#bae6fd" letter-spacing="1.2">PROJECT 02</text>

      <!-- View Repository CTA Link Tag -->
      <g transform="translate(790, 0)">
        <rect x="0" y="0" width="138" height="22" rx="6" fill="#08182b" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5"/>
        <text x="12" y="15" class="font-mono" font-size="10" font-weight="600" fill="#38bdf8" letter-spacing="0.8">VIEW REPOSITORY</text>
        <text x="122" y="15" class="font-mono" font-size="11" fill="#38bdf8">↗</text>
      </g>
    </g>

    <!-- Project Title -->
    <text x="0" y="58" class="font-sans" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      Network Traffic Classifier
    </text>

    <!-- Project Description -->
    <text x="0" y="90" class="font-sans" font-size="13.5" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      7-class intrusion detection engine — reconstructs flows with Scapy, engineers a 22-feature schema,
    </text>
    <text x="0" y="112" class="font-sans" font-size="13.5" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      and classifies traffic (BENIGN, DoS, DDoS, PortScan, Brute Force, Bot, Web Attack) via Random Forest on CIC-IDS2017.
    </text>

    <!-- Bottom Row: Tech Stack Chips -->
    <g transform="translate(0, 142)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect width="78" height="26" rx="6" fill="#150e2e" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
        <text x="39" y="17" class="font-mono" font-size="11" font-weight="600" fill="#e9d5ff" text-anchor="middle">Python</text>
      </g>

      <!-- Scapy -->
      <g transform="translate(86, 0)">
        <rect width="76" height="26" rx="6" fill="#0b1b2e" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="38" y="17" class="font-mono" font-size="11" font-weight="600" fill="#bae6fd" text-anchor="middle">Scapy</text>
      </g>

      <!-- scikit-learn -->
      <g transform="translate(170, 0)">
        <rect width="112" height="26" rx="6" fill="#0b1b2e" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
        <text x="56" y="17" class="font-mono" font-size="11" font-weight="600" fill="#a5f3fc" text-anchor="middle">scikit-learn</text>
      </g>
    </g>
  </g>
</svg>
