<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070412"/>
      <stop offset="50%" stop-color="#0a071a"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>

    <!-- Glass Pill Gradients -->
    <linearGradient id="pill-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e0a22" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="pill-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c203b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#091428" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="micro-grid-tech" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Frame Background (Static) -->
  <rect width="1000" height="320" rx="14" fill="url(#tech-bg)"/>
  <rect width="1000" height="320" rx="14" fill="url(#micro-grid-tech)"/>
  <rect x="1" y="1" width="998" height="318" rx="13" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Section Header Tag -->
  <g transform="translate(36, 36)">
    <rect x="0" y="0" width="125" height="24" rx="6" fill="#1e113d" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="12" cy="12" r="3" fill="#38bdf8" opacity="0.9"/>
    <text x="24" y="16" class="font-mono" font-size="11" font-weight="700" fill="#e9d5ff" letter-spacing="1.5">TECH STACK</text>
    
    <!-- Header Line -->
    <line x1="138" y1="12" x2="928" y2="12" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="928" cy="12" r="2" fill="#a855f7"/>
  </g>

  <!-- Group 1: Languages (Left Column) -->
  <g transform="translate(36, 80)">
    <rect width="445" height="100" rx="10" fill="#0d0922" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.25"/>
    <text x="20" y="28" class="font-mono" font-size="10" font-weight="700" fill="#c084fc" letter-spacing="1.2">SYSTEM &amp; APPLICATION LANGUAGES</text>
    
    <!-- Pills -->
    <g transform="translate(20, 42)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect width="120" height="38" rx="8" fill="url(#pill-violet)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="18" cy="19" r="4" fill="#38bdf8"/>
        <text x="32" y="23" class="font-mono" font-size="13" font-weight="600" fill="#f8fafc">Python</text>
      </g>

      <!-- Java -->
      <g transform="translate(132, 0)">
        <rect width="115" height="38" rx="8" fill="url(#pill-violet)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="18" cy="19" r="4" fill="#a855f7"/>
        <text x="32" y="23" class="font-mono" font-size="13" font-weight="600" fill="#f8fafc">Java</text>
      </g>

      <!-- C -->
      <g transform="translate(259, 0)">
        <rect width="90" height="38" rx="8" fill="url(#pill-violet)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="18" cy="19" r="4" fill="#ec4899"/>
        <text x="32" y="23" class="font-mono" font-size="13" font-weight="600" fill="#f8fafc">C</text>
      </g>
    </g>
  </g>

  <!-- Group 2: Web & Frameworks (Right Column - Top) -->
  <g transform="translate(518, 80)">
    <rect width="446" height="100" rx="10" fill="#091329" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.25"/>
    <text x="20" y="28" class="font-mono" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1.2">BACKEND &amp; INTERFACE FRAMEWORKS</text>
    
    <!-- Pills -->
    <g transform="translate(20, 42)">
      <!-- FastAPI -->
      <g transform="translate(0, 0)">
        <rect width="130" height="38" rx="8" fill="url(#pill-cyan)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="18" cy="19" r="4" fill="#06b6d4"/>
        <text x="32" y="23" class="font-mono" font-size="13" font-weight="600" fill="#f8fafc">FastAPI</text>
      </g>

      <!-- React -->
      <g transform="translate(142, 0)">
        <rect width="125" height="38" rx="8" fill="url(#pill-cyan)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="18" cy="19" r="4" fill="#38bdf8"/>
        <text x="32" y="23" class="font-mono" font-size="13" font-weight="600" fill="#f8fafc">React</text>
      </g>
    </g>
  </g>

  <!-- Group 3: Security & AI / Machine Learning (Left Column - Bottom) -->
  <g transform="translate(36, 195)">
    <rect width="445" height="100" rx="10" fill="#091329" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.25"/>
    <text x="20" y="28" class="font-mono" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1.2">SECURITY, NETWORKING &amp; AI / ML</text>
    
    <!-- Pills -->
    <g transform="translate(20, 42)">
      <!-- Scapy -->
      <g transform="translate(0, 0)">
        <rect width="115" height="38" rx="8" fill="url(#pill-cyan)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="16" cy="19" r="3.5" fill="#38bdf8"/>
        <text x="28" y="23" class="font-mono" font-size="12.5" font-weight="600" fill="#f8fafc">Scapy</text>
      </g>

      <!-- scikit-learn -->
      <g transform="translate(125, 0)">
        <rect width="145" height="38" rx="8" fill="url(#pill-cyan)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="16" cy="19" r="3.5" fill="#f59e0b"/>
        <text x="28" y="23" class="font-mono" font-size="12.5" font-weight="600" fill="#f8fafc">scikit-learn</text>
      </g>

      <!-- Ollama -->
      <g transform="translate(280, 0)">
        <rect width="120" height="38" rx="8" fill="url(#pill-cyan)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="16" cy="19" r="3.5" fill="#e2e8f0"/>
        <text x="28" y="23" class="font-mono" font-size="12.5" font-weight="600" fill="#f8fafc">Ollama</text>
      </g>
    </g>
  </g>

  <!-- Group 4: Database & Version Control (Right Column - Bottom) -->
  <g transform="translate(518, 195)">
    <rect width="446" height="100" rx="10" fill="#0d0922" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.25"/>
    <text x="20" y="28" class="font-mono" font-size="10" font-weight="700" fill="#c084fc" letter-spacing="1.2">DATA PERSISTENCE &amp; TOOLS</text>
    
    <!-- Pills -->
    <g transform="translate(20, 42)">
      <!-- MySQL -->
      <g transform="translate(0, 0)">
        <rect width="130" height="38" rx="8" fill="url(#pill-violet)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="18" cy="19" r="4" fill="#00758f"/>
        <text x="32" y="23" class="font-mono" font-size="13" font-weight="600" fill="#f8fafc">MySQL</text>
      </g>

      <!-- Git -->
      <g transform="translate(142, 0)">
        <rect width="115" height="38" rx="8" fill="url(#pill-violet)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="18" cy="19" r="4" fill="#f97316"/>
        <text x="32" y="23" class="font-mono" font-size="13" font-weight="600" fill="#f8fafc">Git</text>
      </g>
    </g>
  </g>

</svg>
