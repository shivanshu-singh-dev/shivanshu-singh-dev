<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030a"/>
      <stop offset="40%" stop-color="#090514"/>
      <stop offset="75%" stop-color="#0d0720"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <!-- Aurora Gradients -->
    <linearGradient id="aurora-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0"/>
      <stop offset="25%" stop-color="#9333ea" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="aurora-2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="aurora-3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f5f3ff"/>
      <stop offset="75%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="cyan-violet-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="nebula-center" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#05030a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula-cyan" cx="80%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#05030a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula-magenta" cx="20%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#05030a" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-med" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="1000" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Cyber Coordinate Grid -->
  <rect width="1000" height="420" rx="16" fill="url(#cyber-grid)"/>

  <!-- Ambient Nebula Blobs -->
  <circle cx="500" cy="180" r="320" fill="url(#nebula-center)"/>
  <circle cx="820" cy="120" r="260" fill="url(#nebula-cyan)"/>
  <circle cx="180" cy="260" r="240" fill="url(#nebula-magenta)"/>

  <!-- Animated Aurora Ribbons (SMIL Wave Motion) -->
  <g filter="url(#glow-heavy)">
    <!-- Aurora Layer 1 -->
    <path fill="url(#aurora-1)" opacity="0.6">
      <animate attributeName="d" 
        dur="14s" 
        repeatCount="indefinite"
        values="
          M -50 200 C 200 120, 350 280, 550 180 C 750 80, 880 240, 1050 160 L 1050 320 C 880 360, 700 240, 500 300 C 300 360, 150 240, -50 310 Z;
          M -50 170 C 180 250, 380 140, 580 230 C 780 320, 850 130, 1050 200 L 1050 340 C 850 270, 720 370, 520 280 C 320 190, 120 330, -50 280 Z;
          M -50 220 C 220 160, 320 290, 520 170 C 720 50, 900 220, 1050 150 L 1050 300 C 900 350, 680 220, 480 310 C 280 400, 140 230, -50 320 Z;
          M -50 200 C 200 120, 350 280, 550 180 C 750 80, 880 240, 1050 160 L 1050 320 C 880 360, 700 240, 500 300 C 300 360, 150 240, -50 310 Z"
      />
    </path>

    <!-- Aurora Layer 2 -->
    <path fill="url(#aurora-2)" opacity="0.45">
      <animate attributeName="d" 
        dur="18s" 
        repeatCount="indefinite"
        values="
          M -50 260 C 250 340, 420 160, 650 240 C 850 320, 920 180, 1050 230 L 1050 370 C 900 310, 750 390, 550 320 C 350 250, 150 380, -50 330 Z;
          M -50 230 C 180 150, 400 300, 600 200 C 800 100, 900 270, 1050 210 L 1050 350 C 920 400, 740 260, 540 340 C 340 420, 120 260, -50 350 Z;
          M -50 280 C 220 310, 380 190, 620 260 C 820 330, 950 190, 1050 250 L 1050 380 C 880 330, 710 380, 510 300 C 310 220, 180 360, -50 340 Z;
          M -50 260 C 250 340, 420 160, 650 240 C 850 320, 920 180, 1050 230 L 1050 370 C 900 310, 750 390, 550 320 C 350 250, 150 380, -50 330 Z"
      />
    </path>

    <!-- Aurora Layer 3 -->
    <path fill="url(#aurora-3)" opacity="0.35">
      <animate attributeName="d" 
        dur="22s" 
        repeatCount="indefinite"
        values="
          M -50 140 C 280 220, 460 100, 700 180 C 880 240, 960 120, 1050 150 L 1050 270 C 920 230, 760 300, 560 230 C 360 160, 180 270, -50 220 Z;
          M -50 180 C 220 100, 480 240, 660 140 C 840 60, 940 210, 1050 170 L 1050 290 C 900 260, 720 220, 520 260 C 320 300, 140 180, -50 240 Z;
          M -50 140 C 280 220, 460 100, 700 180 C 880 240, 960 120, 1050 150 L 1050 270 C 920 230, 760 300, 560 230 C 360 160, 180 270, -50 220 Z"
      />
    </path>
  </g>

  <!-- Starfield / Drifting Cosmic Light Particles -->
  <g>
    <!-- Twinkling stars -->
    <circle cx="120" cy="80" r="1.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="140" r="1" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="65" r="1.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="95" r="1.2" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="70" r="1.5" fill="#e879f9">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="110" r="1" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="75" r="1.8" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="160" r="1.2" fill="#a78bfa">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="290" r="1.2" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="360" r="1.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="320" r="1.3" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="370" r="1.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="340" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Drifting micro-particles -->
    <circle cx="280" cy="220" r="1.8" fill="#c084fc" filter="url(#glow-soft)">
      <animate attributeName="cy" values="220;200;220" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="280;295;280" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="240" r="2" fill="#38bdf8" filter="url(#glow-soft)">
      <animate attributeName="cy" values="240;255;240" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="710;695;710" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Periodic Shooting Star / Meteor -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.60;0.66;0.68;1" dur="11s" repeatCount="indefinite"/>
      <path d="M 720 40 L 590 120" stroke="url(#cyan-violet-grad)" stroke-width="1.6" stroke-linecap="round" filter="url(#glow-soft)"/>
      <circle cx="590" cy="120" r="2" fill="#ffffff" filter="url(#glow-med)"/>
    </g>
  </g>

  <!-- Precision Orbital Constellation Ring (Subtle Cyber Accent) -->
  <g transform="translate(500, 185)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="380" ry="110" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 16">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="360" ry="100" fill="none" stroke="#06b6d4" stroke-width="0.75" stroke-dasharray="2 24">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="45s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Sleek Cyber Frame Accents & Tech Notches -->
  <g opacity="0.6">
    <!-- Outer Border -->
    <rect x="1" y="1" width="998" height="418" rx="15" fill="none" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.25"/>
    
    <!-- Top-Left Corner Bracket -->
    <path d="M 20 45 L 20 20 L 45 20" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="2" fill="#38bdf8"/>
    
    <!-- Top-Right Corner Bracket -->
    <path d="M 980 45 L 980 20 L 955 20" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="980" cy="20" r="2" fill="#c084fc"/>

    <!-- Bottom-Left Corner Bracket -->
    <path d="M 20 375 L 20 400 L 45 400" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="400" r="2" fill="#c084fc"/>

    <!-- Bottom-Right Corner Bracket -->
    <path d="M 980 375 L 980 400 L 955 400" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="980" cy="400" r="2" fill="#38bdf8"/>

    <!-- Subtle HUD Ticks -->
    <line x1="500" y1="12" x2="500" y2="24" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="490" y1="18" x2="510" y2="18" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- High-Tech Pill Badge: Status / Identity Header -->
  <g transform="translate(500, 68)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0d091f" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.45"/>
    <!-- Animated Status Beacon -->
    <circle cx="-116" cy="0" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.5;4.5;3.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-116" cy="0" r="8" fill="none" stroke="#22d3ee" stroke-width="1">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-98" y="4.5" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="1.5">
      SYSTEM.PORTFOLIO // 2026
    </text>
    <line x1="75" y1="-6" x2="75" y2="6" stroke="#475569" stroke-width="1"/>
    <text x="86" y="4" class="font-mono" font-size="10" fill="#38bdf8" letter-spacing="1">ONLINE</text>
  </g>

  <!-- MAIN HERO TYPOGRAPHY -->
  <g text-anchor="middle">
    <!-- Main Name Title -->
    <text x="500" y="165" class="font-sans" font-size="52" font-weight="800" fill="url(#title-grad)" letter-spacing="4" filter="url(#glow-soft)">
      SHIVANSHU SINGH
    </text>

    <!-- Accent Decorative Horizontal Hairlines -->
    <g opacity="0.6">
      <line x1="280" y1="195" x2="440" y2="195" stroke="url(#aurora-1)" stroke-width="1.5" stroke-linecap="round"/>
      <polygon points="500,192 505,195 500,198 495,195" fill="#38bdf8"/>
      <line x1="560" y1="195" x2="720" y2="195" stroke="url(#aurora-2)" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Primary Subtitle -->
    <text x="500" y="235" class="font-sans" font-size="18" font-weight="600" fill="#e2e8f0" letter-spacing="2.5">
      Computer Science <tspan fill="#a855f7">•</tspan> Cybersecurity
    </text>

    <!-- Tagline: Focus Disciplines -->
    <text x="500" y="272" class="font-mono" font-size="14" font-weight="500" fill="url(#cyan-violet-grad)" letter-spacing="3.5">
      SOFTWARE • SECURITY • AI
    </text>
  </g>

  <!-- Interactive / High-Tech Metadata Grid at Bottom of Hero -->
  <g transform="translate(160, 320)">
    <!-- Card Container -->
    <rect x="0" y="0" width="680" height="58" rx="10" fill="#080614" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.25"/>
    
    <!-- Left Column: Academic & Internship Node -->
    <g transform="translate(24, 22)">
      <circle cx="0" cy="-2" r="3" fill="#a855f7"/>
      <text x="12" y="-3" class="font-mono" font-size="9.5" fill="#94a3b8" letter-spacing="1">INSTITUTION &amp; RESEARCH</text>
      <text x="12" y="14" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9">
        VIT Chennai <tspan fill="#64748b">|</tspan> <tspan fill="#38bdf8">K7 Computing</tspan>
      </text>
    </g>

    <!-- Center Divider -->
    <line x1="340" y1="12" x2="340" y2="46" stroke="#334155" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Right Column: Research Focus Core -->
    <g transform="translate(364, 22)">
      <circle cx="0" cy="-2" r="3" fill="#06b6d4"/>
      <text x="12" y="-3" class="font-mono" font-size="9.5" fill="#94a3b8" letter-spacing="1">CORE SPECIALIZATION</text>
      <text x="12" y="14" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9">
        AI / Agent Security <tspan fill="#64748b">&amp;</tspan> Endpoint Telemetry
      </text>
    </g>
  </g>

</svg>
