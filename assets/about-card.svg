<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="about-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080514"/>
      <stop offset="50%" stop-color="#0b081c"/>
      <stop offset="100%" stop-color="#060917"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-inner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c29" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a0f24" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="violet-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="badge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="micro-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Outer Canvas Card -->
  <rect width="1000" height="340" rx="14" fill="url(#about-bg)"/>
  <rect width="1000" height="340" rx="14" fill="url(#micro-grid)"/>
  <rect x="1" y="1" width="998" height="338" rx="13" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Section Header Tag -->
  <g transform="translate(36, 36)">
    <rect x="0" y="0" width="115" height="24" rx="6" fill="#1e113d" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="12" cy="12" r="3" fill="#a855f7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="16" class="font-mono" font-size="11" font-weight="700" fill="#e9d5ff" letter-spacing="1.5">ABOUT ME</text>
    
    <!-- Header Line -->
    <line x1="128" y1="12" x2="928" y2="12" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="928" cy="12" r="2" fill="#38bdf8"/>
  </g>

  <!-- Left Column: Academic & Experience Glass Card -->
  <g transform="translate(36, 80)">
    <!-- Glass Panel -->
    <rect width="445" height="225" rx="12" fill="url(#card-inner-bg)" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Top Accent Line -->
    <line x1="20" y1="0" x2="160" y2="0" stroke="url(#violet-cyan)" stroke-width="2"/>

    <!-- Section 1: Education -->
    <g transform="translate(24, 28)">
      <!-- Metric Pill for CGPA -->
      <g transform="translate(290, 0)">
        <rect x="0" y="0" width="105" height="24" rx="12" fill="#171033" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6"/>
        <text x="52.5" y="16" class="font-mono" font-size="11" font-weight="700" fill="#f5d0fe" text-anchor="middle">CGPA 9.26 / 10</text>
      </g>

      <text x="0" y="10" class="font-mono" font-size="10" font-weight="700" fill="#a855f7" letter-spacing="1.2">ACADEMIC FOUNDATION</text>
      <text x="0" y="32" class="font-sans" font-size="15" font-weight="700" fill="#ffffff">
        3rd-Year B.Tech Computer Science
      </text>
      <text x="0" y="52" class="font-sans" font-size="13" font-weight="500" fill="#94a3b8">
        Specialization in Cybersecurity <tspan fill="#64748b">•</tspan> <tspan fill="#cbd5e1">VIT Chennai</tspan>
      </text>
    </g>

    <!-- Divider Line -->
    <line x1="24" y1="116" x2="420" y2="116" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Section 2: Industry Internship -->
    <g transform="translate(24, 138)">
      <!-- Status Badge -->
      <g transform="translate(290, 0)">
        <rect x="0" y="0" width="105" height="24" rx="12" fill="#0c1e33" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="14" cy="12" r="3" fill="#38bdf8">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="60" y="16" class="font-mono" font-size="10" font-weight="700" fill="#bae6fd" text-anchor="middle">CURRENT</text>
      </g>

      <text x="0" y="10" class="font-mono" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1.2">RESEARCH INTERNSHIP</text>
      <text x="0" y="32" class="font-sans" font-size="15" font-weight="700" fill="#ffffff">
        K7 Computing
      </text>
      <text x="0" y="52" class="font-sans" font-size="13" font-weight="500" fill="#94a3b8">
        Cybersecurity / Malware Research <tspan fill="#64748b">•</tspan> <tspan fill="#cbd5e1">Sept–Oct 2026</tspan>
      </text>
    </g>
  </g>

  <!-- Right Column: Focus Areas & Targets Glass Card -->
  <g transform="translate(518, 80)">
    <!-- Glass Panel -->
    <rect width="446" height="225" rx="12" fill="url(#card-inner-bg)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.25"/>
    
    <!-- Top Accent Line -->
    <line x1="20" y1="0" x2="160" y2="0" stroke="url(#cyan-violet)" stroke-width="2"/>

    <!-- Section 1: Focus Areas -->
    <g transform="translate(24, 28)">
      <text x="0" y="10" class="font-mono" font-size="10" font-weight="700" fill="#06b6d4" letter-spacing="1.2">CURRENT TECHNICAL FOCUS</text>
      
      <!-- Bullet 1 -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="398" height="30" rx="6" fill="#13132e" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
        <circle cx="16" cy="15" r="3.5" fill="#a855f7"/>
        <text x="32" y="19.5" class="font-sans" font-size="13" font-weight="600" fill="#e2e8f0">
          AI / Agent Security
        </text>
      </g>

      <!-- Bullet 2 -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="398" height="30" rx="6" fill="#0f1933" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>
        <circle cx="16" cy="15" r="3.5" fill="#38bdf8"/>
        <text x="32" y="19.5" class="font-sans" font-size="13" font-weight="600" fill="#e2e8f0">
          Endpoint &amp; Network Security
        </text>
      </g>
    </g>

    <!-- Divider Line -->
    <line x1="24" y1="138" x2="420" y2="138" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Section 2: Target Trajectory -->
    <g transform="translate(24, 156)">
      <text x="0" y="10" class="font-mono" font-size="10" font-weight="700" fill="#f472b6" letter-spacing="1.2">TARGET ROLES &amp; OPPORTUNITIES</text>
      <text x="0" y="32" class="font-sans" font-size="13.5" font-weight="600" fill="#f8fafc">
        Software, Cybersecurity, AI, and related internships &amp; jobs
      </text>
      <text x="0" y="50" class="font-sans" font-size="12" font-weight="400" fill="#94a3b8">
        Building resilient software systems &amp; security infrastructure
      </text>
    </g>
  </g>
</svg>
