<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="100%">
  <defs>
    <!-- Aurora Divider Gradient -->
    <linearGradient id="footer-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05030a" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </linearGradient>

    <!-- Background Gradient -->
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090516"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Background Base (Static) -->
  <rect width="1000" height="120" rx="12" fill="url(#footer-bg)"/>
  <rect x="1" y="1" width="998" height="118" rx="11" fill="none" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Top Flowing Aurora Wave Line (Static) -->
  <path d="M 0 16 Q 250 5, 500 16 T 1000 16" fill="none" stroke="url(#footer-aurora)" stroke-width="2"/>

  <!-- Centered Identity Info (No fake clickable buttons inside flattened image) -->
  <g text-anchor="middle" transform="translate(500, 60)">
    <text x="0" y="0" class="font-sans" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.5">
      SHIVANSHU SINGH
    </text>
    <text x="0" y="24" class="font-mono" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="1.2">
      Computer Science • Cybersecurity <tspan fill="#64748b">|</tspan> <tspan fill="#c084fc">VIT Chennai</tspan>
    </text>
  </g>
</svg>
